
x-defaults: &defaults
  restart: unless-stopped
  env_file:
    - .env.prod
  networks:
    - internal
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  security_opt:
    - no-new-privileges:true

services:
  nginx:
    <<: *defaults
    image: nginx:1.29-alpine
    ports:
      - "8030:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # depends_on:
    #   api:
    #     condition: service_healthy
    #   web:
    #     condition: service_started
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1 || exit 1"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 10s
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  api:
    <<: *defaults
    image: ghcr.io/imjustnon/mentor-mentee-api:staging
    expose:
      - "3000"
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 30s

  web:
    <<: *defaults
    image: ghcr.io/imjustnon/mentor-mentee-web:staging
    expose:
      - "3000"
    # depends_on:
    #   api:
    #     condition: service_healthy
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 30s

  mentor:
    <<: *defaults
    image: ghcr.io/imjustnon/mentor-mentee-mentor:staging
    expose:
      - "3000"
    # depends_on:
    #   api:
    #     condition: service_healthy
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 30s

networks:
  internal:
    driver: bridge