  cloudflared:
    <<: *defaults
    image: cloudflare/cloudflared:latest
    command: tunnel run --protocol http2
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN is required}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s

  api:
    <<: *defaults
    image: ghcr.io/imjustnon/whoami-api:latest
    expose:
      - "3010"
    depends_on:
      redis:
        condition: service_started
    # labels:
    #   com.centurylinklabs.watchtower.enable: "true"
    ports: 
      - "3010:3010"
    restart: unless-stopped

  web:
    <<: *defaults
    image: ghcr.io/imjustnon/whoami-web:latest
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    # labels:
    #   com.centurylinklabs.watchtower.enable: "true"
    ports: 
      - "3000:3000"
    restart: unless-stopped
    

  mentor:
    <<: *defaults
    image: ghcr.io/imjustnon/whoami-mentor:latest
    expose:
      - "3005"
    depends_on:
      api:
        condition: service_started
    # labels:
    #   com.centurylinklabs.watchtower.enable: "true"
    ports: 
      - "3005:3005"
    restart: unless-stopped


  redis:
    <<: *defaults
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

networks:
  internal:
    driver: bridge


volumes:
  redis_data: