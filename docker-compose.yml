x-defaults: &defaults
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - internal
  labels:
    com.centurylinklabs.watchtower.enable: "true"
    traefik.docker.network: internal
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=internal
      - --entrypoints.web.address=:80
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "8008:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

  web:
    <<: *defaults
    image: ghcr.io/imjustnon/mentor-mentee-web:staging
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.docker.network: internal
      traefik.enable: "true"
      traefik.http.routers.web.entrypoints: web
      traefik.http.routers.web.rule: Host(`${WEB_HOST:-localhost}`)
      traefik.http.routers.web.service: web
      traefik.http.services.web.loadbalancer.server.port: "3000"

  api:
    <<: *defaults
    image: ghcr.io/imjustnon/mentor-mentee-api:staging
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.docker.network: internal
      traefik.enable: "true"
      traefik.http.middlewares.api-strip.stripprefix.prefixes: /api
      traefik.http.routers.api.entrypoints: web
      traefik.http.routers.api.priority: "100"
      traefik.http.routers.api.rule: Host(`${WEB_HOST:-localhost}`) && PathPrefix(`/api`)
      traefik.http.routers.api.middlewares: api-strip
      traefik.http.routers.api.service: api
      traefik.http.services.api.loadbalancer.server.port: "3010"

  mentor:
    <<: *defaults
    image: ghcr.io/imjustnon/mentor-mentee-mentor:staging
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.docker.network: internal
      traefik.enable: "true"
      traefik.http.routers.mentor.entrypoints: web
      traefik.http.routers.mentor.rule: Host(`${MENTOR_HOST:-mentor.localhost}`)
      traefik.http.routers.mentor.service: mentor
      traefik.http.services.mentor.loadbalancer.server.port: "3005"

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    command:
      - --label-enable
      - --cleanup
      - --rolling-restart
      - --interval
      - "300"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
    networks:
      - internal

networks:
  internal:
    driver: bridge